[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "threatleans"
version = "1.0.0"
description = "Evidence-first threat intelligence with hybrid retrieval and resilient model routing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "numpy>=1.26,<3",
  "rank-bm25>=0.2.2,<1", "langgraph>=1,<2", "typer>=0.15,<1",
  "beautifulsoup4>=4.12,<5", "argon2-cffi>=23,<26", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dense = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "qdrant-client>=1.14,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.9,<1"]

[project.scripts]
threatleans = "threatleans.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
